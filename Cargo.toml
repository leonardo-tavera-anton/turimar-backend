[package]
name = "turimar-backend"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlx = { version = "0.7", features = ["runtime-tokio", "postgres", "chrono", "rust_decimal"] }
tower-http = { version = "0.5", features = ["cors"] }
dotenvy = "0.15"
uuid = { version = "1.0", features = ["serde", "v4"] }

rust_decimal = { version = "1.36", features = ["db-postgres", "serde-with-str"] }
chrono = { version = "0.4", features = ["serde"] }